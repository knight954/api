
<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <style>
        body {
            font-family: Arial;
            background: #eaf4ff;
            text-align: center;
            padding-top: 100px;
        }
        .container {
            background: white;
            width: 320px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px #ccc;
        }
        input, button {
            padding: 10px;
            margin: 8px;
        }
        button {
            background: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        <input type="text" id="city" placeholder="Enter city name">
        <button onclick="getWeather()">Get Weather</button>
        <p id="message"></p>
        <div id="result"></div>

        <hr>
        <h2>Upload Files / Folder</h2>
        <input type="file" id="uploadInput" multiple webkitdirectory directory>
        <button onclick="uploadFiles()">Upload Selected Folder</button>
        <p id="uploadMessage"></p>
        <ul id="uploadedFiles"></ul>
    </div>

    <script>
        async function uploadFiles() {
            const input = document.getElementById("uploadInput");
            const uploadMessage = document.getElementById("uploadMessage");
            const uploadedFiles = document.getElementById("uploadedFiles");

            if (!input.files.length) {
                uploadMessage.textContent = "Choose a file or folder first.";
                uploadedFiles.innerHTML = "";
                return;
            }

            uploadMessage.textContent = "Uploading...";
            uploadedFiles.innerHTML = "";

            const formData = new FormData();
            Array.from(input.files).forEach((file) => {
                const fileName = file.webkitRelativePath || file.name;
                formData.append("files", file, fileName);
            });

            try {
                const response = await fetch("/api/upload", {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Upload failed");
                }

                uploadMessage.textContent = data.message;
                uploadedFiles.innerHTML = data.files.map(file => `<li>${file.originalName}</li>`).join("");
            } catch (error) {
                uploadMessage.textContent = error.message;
                uploadedFiles.innerHTML = "";
            }
        }

        async function getWeather() {
            const city = document.getElementById("city").value.trim();
            const message = document.getElementById("message");
            const result = document.getElementById("result");

            if (!city) {
                message.textContent = "Enter a city name";
                result.innerHTML = "";
                return;
            }

            message.textContent = "Loading...";
            result.innerHTML = "";

            try {
                const response = await fetch(
                    `/api/weather?city=${encodeURIComponent(city)}`
                );
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Weather not found");
                }

                message.textContent = "";
                result.innerHTML = `
                    <h2>${data.city}, ${data.country}</h2>
                    <h1>${data.temperature} °C</h1>
                    <p>Weather: ${data.description}</p>
                    <p>Feels Like: ${data.feels_like} °C</p>
                    <p>Humidity: ${data.humidity}%</p>
                    <p>Wind Speed: ${data.wind_speed} m/s</p>
                `;
            } catch (error) {
                message.textContent = error.message;
            }
        }
    </script>
</body>
</html>
