
<!DOCTYPE html>
<html>
<head>
    <title>Currency Converter</title>
    <style>
        body {
            font-family: Arial;
            background: #eaf4ff;
            text-align: center;
            padding-top: 100px;
        }
        .container {
            background: white;
            width: 320px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px #ccc;
        }
        input, select, button {
            padding: 10px;
            margin: 8px;
        }
        button {
            background: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Currency Converter</h1>

        <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="any">

        <br>

        <select id="from">
            <option value="USD">USD - US Dollar</option>
            <option value="INR">INR - Indian Rupee</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - British Pound</option>
            <option value="JPY">JPY - Japanese Yen</option>
        </select>

        <br>

        <select id="to">
            <option value="INR">INR - Indian Rupee</option>
            <option value="USD">USD - US Dollar</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - British Pound</option>
            <option value="JPY">JPY - Japanese Yen</option>
        </select>

        <br>

        <button onclick="convertCurrency()">Convert</button>

        <p id="message"></p>
        <div id="result"></div>
    </div>

    <script>
        async function convertCurrency() {
            const amount = document.getElementById("amount").value;
            const from = document.getElementById("from").value;
            const to = document.getElementById("to").value;
            const message = document.getElementById("message");
            const result = document.getElementById("result");

            if (!amount || Number(amount) <= 0) {
                message.textContent = "Enter a valid amount";
                result.innerHTML = "";
                return;
            }

            message.textContent = "Converting...";
            result.innerHTML = "";

            try {
                const response = await fetch(
                    `/api/currency?from=${from}&to=${to}&amount=${encodeURIComponent(amount)}`
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Conversion failed");
                }

                message.textContent = "";
                result.innerHTML = `
                    <h2>${data.amount} ${data.from}</h2>
                    <h2>${data.converted_amount} ${data.to}</h2>
                    <p>Exchange Rate: 1 ${data.from} = ${data.exchange_rate} ${data.to}</p>
                `;
            } catch (error) {
                message.textContent = error.message;
            }
        }
    </script>
</body>
</html>
